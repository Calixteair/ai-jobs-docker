# Surcharge réservée aux tests (local et CI) : publie MySQL sur 127.0.0.1
# pour que pytest, lancé hors conteneur, puisse s'y connecter.
# DB_TEST_BIND=0.0.0.0 en CI Jenkins : le démon Docker (dind) n'est pas sur la
# machine qui lance pytest, 127.0.0.1 n'y serait pas joignable.
# Usage : docker compose -f compose.yaml -f compose.test.yaml up -d --wait db
services:
  db:
    ports:
      - "${DB_TEST_BIND:-127.0.0.1}:${DB_TEST_PORT:-3307}:3306"
