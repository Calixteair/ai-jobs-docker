[project]
name = "ai-jobs-docker"
version = "0.1.0"
description = "Dashboard Streamlit + MySQL sur le marché de l'emploi IA 2025-2026"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "app"]
markers = [
    "integration: tests nécessitant une base MySQL démarrée (make db-up)",
]
