# Compose de la production sur le VPS (ai-jobs.calixteair.fr), installé par stack-sync depuis le
# tag vX.Y.Z signé : stack-sync remplace :<préfixe>-latest par :vX.Y.Z-<préfixe> (images immuables
# de Harbor) et vérifie ce fichier contre sa politique (vps-soc-config, stack-sync/policies/ai-jobs.json).
# Les variables MYSQL_* viennent de /run/ai-jobs/.env, rendu par bao-agent (deploy/prod/agent.hcl).
name: ai-jobs

services:
  db:
    # mysql:8.4 + scripts d'initialisation embarqués (bao-deploy.sh ne copie aucun fichier)
    image: registry.calixteair.fr/ai-jobs/ai-jobs:db-latest
    container_name: ai-jobs-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
      MYSQL_USER: ${MYSQL_USER:?err}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  app:
    image: registry.calixteair.fr/ai-jobs/ai-jobs:app-latest
    container_name: ai-jobs-app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?err}
      DB_USER: ${MYSQL_USER:?err}
      DB_PASSWORD: ${MYSQL_PASSWORD:?err}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      # Joint par Nginx Proxy Manager sous le nom ai-jobs-app:8501
      - nginx-reverse-proxy
    mem_limit: 512m
    restart: unless-stopped
    # Aucun port publié : accès uniquement via NPM (WebSockets activés)

volumes:
  mysql_data:

networks:
  internal:
  nginx-reverse-proxy:
    external: true
