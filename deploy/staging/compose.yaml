# Compose du staging sur le VPS (ai-jobs-staging.calixteair.fr, derrière l'access list NPM).
# Images publiées par Jenkins sur Harbor à chaque commit de dev (:<préfixe>-staging), aucun build,
# aucun port publié. Les variables MYSQL_* et OPENROUTER_API_KEY viennent de /run/ai-jobs-staging/.env,
# rendu par bao-agent (OpenBao secret/ai-jobs/staging/mysql et .../llm) ; bao-deploy.sh fait pull + up -d.
name: ai-jobs-staging

services:
  db:
    # mysql:8.4 + scripts d'initialisation embarqués (bao-deploy.sh ne copie aucun fichier)
    image: registry.calixteair.fr/ai-jobs/ai-jobs:db-staging
    container_name: ai-jobs-staging-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?err}
      MYSQL_USER: ${MYSQL_USER:?err}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      # Ping TCP + synchro du schéma terminée (database/bin/healthcheck.sh)
      test: ["CMD", "db-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  app:
    image: registry.calixteair.fr/ai-jobs/ai-jobs:app-staging
    container_name: ai-jobs-staging-app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?err}
      DB_USER: ${MYSQL_USER:?err}
      DB_PASSWORD: ${MYSQL_PASSWORD:?err}
      # L'app ne parle qu'à la gateway, qui choisit le modèle (modes auto / ollama / openrouter)
      LLM_GATEWAY_URL: http://gateway:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - llm
      # Joint par Nginx Proxy Manager sous le nom ai-jobs-staging-app:8501
      - nginx-reverse-proxy
    mem_limit: 512m
    restart: unless-stopped
    # Aucun port publié : accès uniquement via NPM (WebSockets activés)

  gateway:
    # Gateway LLM : Ollama du PC par le tailnet s'il est allumé, sinon OpenRouter (clé rendue par
    # bao-agent, OpenBao secret/ai-jobs/staging/llm). Sans IA, le dashboard fonctionne quand même.
    image: registry.calixteair.fr/ai-jobs/ai-jobs:gateway-staging
    container_name: ai-jobs-staging-gateway
    environment:
      # PC (thinkpad) sur le tailnet ; Ollama n'y est joignable que depuis le VPS (ACL Headscale)
      OLLAMA_URL: http://100.64.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    networks:
      # Réseau partagé avec l'app seule : ni la base ni NPM ne peuvent consommer la clé OpenRouter
      - llm
    mem_limit: 256m
    restart: unless-stopped
    # Aucun port publié

volumes:
  mysql_data:

networks:
  internal:
  llm:
  nginx-reverse-proxy:
    external: true
